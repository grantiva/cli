scheme: "Landmarks (UI Testing)"
simulator: cov3-ios-26
bundle_id: com.kylebrowning.Landmarks
screens:
  - name: Wait Labels
    path:
      - wait: 3
      - wait: 1.5
      - assert_visible: {text: "Landmarks", exact: true}
      - assert_visible: "Featured"
  - name: Exact Negative Marker
    path:
      - assert_not_visible: {text: "Golden Gate.*", exact: true}
