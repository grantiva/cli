appId: com.kylebrowning.landmarks
---
- launchApp
- tapOn: "Lake Tahoe"
- tapOn: "Favorite"
- assertVisible: "Unfavorite"
- tapOn: "Landmarks"
- tapOn: "Favorites"
- assertVisible: "Lake Tahoe"
- takeScreenshot: "Favorites With Item"
- swipe:
    direction: LEFT
    from: "Lake Tahoe"
- assertVisible: "Remove from favorites"
