appId: com.kylebrowning.landmarks
---
- launchApp
- tapOn: "Deep Links"
- tapOn: "Edit Landmark"
- tapOn: "Location"
- inputText: " · Ünïcødé ✓"
- assertVisible: "San Francisco, CA · Ünïcødé ✓"
