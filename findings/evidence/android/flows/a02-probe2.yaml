appId: com.kylebrowning.landmarks
---
- launchApp
- tapOn: "Lake Tahoe"
- tapOn: "Favorite"
- assertVisible: "Unfavorite"
- tapOn: "Landmarks"
- tapOn: "Favorites"
- assertVisible: "Lake Tahoe"
- takeScreenshot: "Favorites With Item"
- swipe:
    direction: LEFT
    from: "Lake Tahoe"
- waitForAnimationToEnd
- takeScreenshot: "AfterFromSwipe"
- swipe:
    start: 155, 500
    end: 0, 500
    duration: 300
- waitForAnimationToEnd
- takeScreenshot: "AfterAbsSwipeFromCentreToEdge"
