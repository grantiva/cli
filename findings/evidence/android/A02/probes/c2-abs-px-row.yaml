appId: com.kylebrowning.landmarks
---
- launchApp
- tapOn: "Lake Tahoe"
- tapOn: "Favorite"
- assertVisible: "Unfavorite"
- tapOn: "Landmarks"
- tapOn: "Favorites"
- assertVisible: "Lake Tahoe"
- takeScreenshot: "Before"
- swipe:
    start: 900, 520
    end: 100, 520
- waitForAnimationToEnd
- takeScreenshot: "After"
- assertNotVisible: "Lake Tahoe"
