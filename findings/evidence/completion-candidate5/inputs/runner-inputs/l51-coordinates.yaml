appId: com.kylebrowning.landmarks
env:
  LANDMARKS_SEED: many
---
- launchApp:
    clearState: true
- assertVisible: "Golden Gate Bridge"
- takeScreenshot: "before-coordinates"
- wait: 5000
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 375
- assertVisible: "Mono Lake"
- takeScreenshot: "after-coordinates"
- wait: 5000
