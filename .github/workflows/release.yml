name: Release

on:
  workflow_dispatch:
  push:
    tags:
      # Bare SemVer only: 2.0.1, 2.1.0-rc1. Tags are never prefixed with v.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  build:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the compiled-in version
        run: |
          # The git tag IS the version: no v prefix, exactly what
          # `grantiva --version` prints. Verify they agree before anything is
          # published — a mismatch would ship a GitHub release and a Homebrew
          # formula claiming a version the binary does not report.
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v*)
              echo "Tag $VERSION has a v prefix. Tags are bare SemVer (e.g. 2.0.1); retag without the v." >&2
              exit 1 ;;
          esac
          DECLARED=$(sed -n 's/.*grantivaVersion = "\(.*\)".*/\1/p' Sources/GrantivaCore/Version.swift)
          if [ -z "$DECLARED" ]; then
            echo "Could not read grantivaVersion from Sources/GrantivaCore/Version.swift" >&2
            exit 1
          fi
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "Tag is $VERSION, but Version.swift declares $DECLARED." >&2
            echo "Bump Version.swift to match the tag, or tag the version the binary reports." >&2
            exit 1
          fi
          echo "tag $VERSION matches Version.swift"

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify and package binary
        run: |
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          BINARY="$BIN_DIR/grantiva"
          BUNDLE="$BIN_DIR/grantiva_GrantivaCore.bundle"
          test -f "$BINARY" || { echo "Binary not found at $BINARY"; exit 1; }
          test -d "$BUNDLE" || { echo "Resource bundle not found at $BUNDLE"; exit 1; }
          strip "$BINARY"
          tar -czf "grantiva-${{ github.ref_name }}-macos.tar.gz" -C "$BIN_DIR" grantiva grantiva_GrantivaCore.bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grantiva-${{ github.ref_name }}-macos.tar.gz
          generate_release_notes: true

      - name: Update Homebrew formula
        run: |
          SHA=$(shasum -a 256 "grantiva-${{ github.ref_name }}-macos.tar.gz" | awk '{print $1}')

          # The tag is the bare version, so it names the git tag, the release
          # asset, and Homebrew's `version` field without any rewriting.
          VERSION="${{ github.ref_name }}"

          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/grantiva/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Formula/grantiva.rb << FORMULA
          class Grantiva < Formula
            desc "The CLI for iOS developers — visual regression testing, feature flags, and more"
            homepage "https://grantiva.io"
            url "https://github.com/grantiva/cli/releases/download/${VERSION}/grantiva-${VERSION}-macos.tar.gz"
            sha256 "${SHA}"
            version "${VERSION}"
            license "MIT"

            depends_on :macos

            def install
              libexec.install "grantiva", "grantiva_GrantivaCore.bundle"
              bin.install_symlink libexec/"grantiva"
            end

            test do
              assert_match "USAGE: grantiva", shell_output("#{bin}/grantiva --help 2>&1")
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/grantiva.rb
          git commit -m "Update grantiva to ${VERSION}"
          git push
