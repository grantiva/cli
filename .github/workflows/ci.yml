name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner version matches embedded tarballs
        run: |
          set -euo pipefail
          expected=$(grep -Eo 'runnerVersion\s*=\s*"[^"]+"' \
            Sources/GrantivaCore/Runner/RunnerManager.swift \
            | sed -E 's/.*"([^"]+)".*/\1/')
          stage=$(mktemp -d)
          for architecture in arm64 amd64; do
            extracted="$stage/$architecture"
            mkdir -p "$extracted"
            tarball="Sources/GrantivaCore/Resources/grantiva-runner-$architecture.tar.gz"
            tar -xzf "$tarball" -C "$extracted"
            actual=$("$extracted/grantiva-runner" --version | sed -n '1p' | awk '{print $2}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::RunnerManager.runnerVersion is \"$expected\" but"
              echo "::error::$architecture embedded tarball binary reports \"$actual\"."
              echo "::error::Bump RunnerManager.runnerVersion (or rebuild the runner tarball)"
              echo "::error::so the CLI forces re-extraction on upgrade."
              exit 1
            fi
            echo "$architecture runner version matches: $actual"
          done

      - name: Build
        run: swift build

      - name: Test
        run: swift test
